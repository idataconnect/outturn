[package]
name = "outturn-agent-default"
version = "0.1.0"
edition = "2021"
description = "Default agent: runs one conversational turn against the host's model"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.151"
# Pure Rust end to end -- deflate through zlib-rs -- so it compiles to wasm
# and inflates inside the sandbox, where a zip bomb blows up the guest and not
# the platform. At least 4 for `new_stream`: an archive is written as it is
# built rather than assembled in memory first. Held at 6 because 7 and later
# depend on typed-path, which turns on a nightly-only feature for wasip2 and
# so does not build here on stable. No time crate: entry timestamps are not
# worth a dependency.
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Matched to what cargo-component 0.21 generates.
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }

[package.metadata.component]
package = "outturn:agent"

[package.metadata.component.target]
path = "../../wit"
