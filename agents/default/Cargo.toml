[package]
name = "outturn-agent-default"
version = "0.1.0"
edition = "2021"
description = "Default agent: runs one conversational turn against the host's model"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.151"
# Pure Rust end to end -- deflate through miniz_oxide -- so it compiles to wasm
# and inflates inside the sandbox, where a zip bomb blows up the guest and not
# the platform. No time crate: entry timestamps are not worth a dependency.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Matched to what cargo-component 0.21 generates.
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }

[package.metadata.component]
package = "outturn:agent"

[package.metadata.component.target]
path = "../../wit"
