# What a bare checkout can prove about itself.
#
# Deliberately only the tier that needs nothing external. `cargo test` with no
# features runs the fast suite; `slow-tests` instantiates a WebAssembly sandbox
# per case and `integration-tests` wants Postgres and a gateway, and neither
# belongs in the check that gates a pull request. Cargo.toml explains the split
# at the feature definitions.
#
# A missing tool fails here rather than skipping, for the reason the README
# gives about skipped tests: a green run that tested nothing is worse than a
# red one.

name: CI

# Release tags too, so a version is published only from a commit this has
# passed on (images.yml runs after this, never instead of it).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Checking out the code is all any job does with the repository token.
permissions:
  contents: read

# A force-push or a second push to the same branch makes the earlier run
# pointless. Cancel it rather than pay for it -- except on main, where each
# commit's result is a fact worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stable, tracking whatever that is. The Dockerfile builds from
      # `rust:1` pinned by digest, and is moved to the newest when the pins
      # are raised; CI running ahead of it finds a new release's surprises
      # before the image does. Pinning a version here would mean CI could go
      # red for a toolchain the thing being shipped never uses.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest to run and the least interesting
      # to argue about in review.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- --deny warnings

      # No features. The fast tier is what a clone can run, and this job is
      # the promise that it stays that way -- a test that quietly grows a
      # dependency on a live service fails here, in the open.
      - name: Test
        run: cargo test

  # k8s/deploy and k8s/base are kept apart, and must still agree on what a
  # local cluster is there to teach about production: grace periods, the
  # runtime's memory limit, probes, security contexts. The script says why
  # this is a check and not a shared Component.
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # kubectl is on the runner image; PyYAML is not on its system Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pyyaml

      - name: Base and deploy agree
        run: scripts/check-k8s-parity.py

      # The image built and run the way k8s/deploy runs it, since an image
      # can pass every check above and still not start under its pod's
      # securityContext; v0.1.0's did not.
      - name: UI image starts under the pod's restrictions
        run: scripts/check-ui-image.sh

  # The HEIC converter is a workspace of its own, so that nothing else needs
  # libheif to build; which also means the job above never compiles it. Its
  # tests decode a real photo, so the HEVC plugin is installed as well as the
  # library -- and zlib's headers, which Ubuntu's libheif.pc requires and
  # --no-install-recommends leaves out.
  heic:
    name: HEIC converter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderers/heic
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderers/heic

      - name: libheif
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 zlib1g-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: Test
        run: cargo test

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `ci` rather than `install`: it installs the lockfile as written and
      # fails if package.json has drifted from it, which is the whole point of
      # committing one.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Typechecks as a side effect -- `build` is `tsc -b && vite build`, so a
      # type error fails here without a separate step for it.
      - name: Build
        run: npm run build
