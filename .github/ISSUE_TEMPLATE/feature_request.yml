name: Feature request
description: Something outturn does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind, if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways around it, including ones that work today.
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checked
      options:
        - label: docs/roadmap.md does not already plan this.
          required: true
