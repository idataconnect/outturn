[workspace]
members = ["crates/core", "crates/api", "crates/gateway", "crates/runtime"]
# The agent component builds for wasm on its own toolchain, and is not one of
# the tiers; inside the workspace its build refuses to start.
exclude = ["agents/default"]
# The whole workspace, so `cargo test` still means every test -- not only the
# root package's integration suites.
default-members = [".", "crates/core", "crates/api", "crates/gateway", "crates/runtime"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
# Built into images, never published to crates.io.
publish = false

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "migrate", "chrono"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-stream = "0.3"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
# rustls rather than the default native-tls: one TLS stack (rust-s3 already
# uses rustls), and no OpenSSL to ship -- which, on Debian, also brought zlib
# and zstd, none of which a distroless image carries. The system's roots, so
# a certificate an operator installs is still trusted.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "system-proxy",
] }
# A specification's relative `servers` entry, resolved against where it was
# fetched from.
url = "2"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
# wasmtime's default features, less `cache`: its on-disk compilation cache,
# which the runtime never configures (compiled components are kept in memory,
# crates/runtime/src/component/cache.rs). The feature brings zstd 0.13, which
# has open advisories and which wasmtime has not moved off.
wasmtime = { version = "50.0.1", default-features = false, features = [
    "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null",
    "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator",
    "demangle", "addr2line", "coredump", "debug-builtins", "runtime",
    "component-model", "component-model-async", "threads", "stack-switching",
    "std", "debug", "compile-time-builtins", "wit-parser",
] }
wasmtime-wasi = "50.0.1"
anyhow = "1"
rpassword = "7.5.4"
pasetors = { version = "0.7", features = ["paserk"] }
ed25519-dalek = "3.0.0"
rand = "0.10.3"
thiserror = "2"
argon2 = "0.6"
sha2 = "0.11.1"
# Webhook signatures, both ends: the API verifies an inbound delivery and the
# Hollowbrook fixture signs an outbound one.
hmac = "0.13.0"
# RS256 for a service account's assertion (docs/service-accounts.md), gateway
# only. Already built for rustls, so naming it adds nothing to the tree; and its
# private-key operations are constant-time, which a pure-Rust RSA's are not.
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
hex = "0.4"
# Data URLs for an image on its way to a model; nothing else here needs it,
# and the session token that claims to be base64 is hex.
base64 = "0.22"
# Checksums in the frames of AWS's event stream, which Bedrock streams in.
crc32fast = "1.5.1"
# The model catalog ships gzipped in the image (crates/core/src/catalog.rs).
flate2 = "1.1.10"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# fail-on-err is in the crate's default set and default-features = false had
# quietly dropped it, so every non-2xx answer came back as Ok: a rejected PUT
# reported success, a 403 body was returned as a file's contents, and the
# classifier below it never saw an error at all.
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
chrono-tz = { version = "0.10.4", default-features = false }
serde-saphyr = "1.3.0"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
zeroize = "1.9.0"
# Inbound mail, taken apart for the email trigger.
mail-parser = "0.11.9"

tower = { version = "0.5", features = ["util"] }

# The root package: the integration tests, and the small tools that are not a
# tier. Each tier is a crate under crates/, so changing one rebuilds that one.
[package]
name = "outturn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A fast and secure foundation for building and running agent platforms"

[lib]
# The component bindings are generated by wasmtime's bindgen! macro, and
# rustdoc cannot resolve the module it produces -- so every `cargo test` run
# ends in a doctest failure that has nothing to do with the tests. There are no
# doc examples to run, so the whole phase is switched off rather than left
# failing where it would mask a real one.
doctest = false

[dependencies]
flate2 = { workspace = true }
outturn-core = { path = "crates/core" }
outturn-api = { path = "crates/api" }
outturn-gateway = { path = "crates/gateway" }
outturn-runtime = { path = "crates/runtime" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-stream = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rust-s3 = { workspace = true }
chrono-tz = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
# test-util provides the virtual clock, so tests that only wait need not
# spend real time doing it.
tokio = { workspace = true, features = ["test-util"] }
# A service account key made per test, so none is checked in.
aws-lc-rs = { workspace = true }

[features]
# Tests that need services running: Postgres for the database suites, a
# gateway and model for the agent component. Gated so `cargo test` on a bare
# checkout builds and runs only what needs nothing, rather than silently
# skipping and reporting success. Each database test runs in its own schema,
# so they are safe to run in parallel.
#
# Implies slow-tests, so one flag before a push runs everything.
integration-tests = ["slow-tests"]

# Tests gated for what they cost rather than for what they need. The component
# suite needs no services at all, but instantiates a WebAssembly sandbox per
# case and saturates the machine doing it -- which is a poor trade for the
# check someone runs twenty times an hour while changing one function.
slow-tests = ["outturn-api/slow-tests"]

# Tests that call a real provider, on a real key, and spend real money.
#
# Deliberately implied by nothing. `integration-tests` means "I have services
# running"; this means "I am willing to be billed", and they are not the same
# sentence. Somebody who clones this, sets the keys the documentation tells
# them to set, and runs the suite a dozen times while finding their way around
# should not discover afterwards that we spent their money for them. A key in
# the environment is a key, not permission.
#
# So the flag is the consent, and it has to be typed every time:
#
#     cargo test --features live-providers
#
# Within the suite a missing key fails rather than skips. Asking for these
# tests and being told they passed without any of them having run is the one
# outcome worse than not running them.
live-providers = []

# The mock provider. A binary rather than a test fixture because a load test
# has to go through the gateway's real HTTP client, streaming and timeouts --
# an in-process stand-in measures the stand-in.
[[bin]]
name = "mockllm"
path = "src/bin/mockllm.rs"

[[bin]]
name = "hollowbrook"
path = "src/bin/hollowbrook.rs"

[[test]]
name = "api"
required-features = ["integration-tests"]

[[test]]
name = "storage_s3"
required-features = ["integration-tests"]

[[test]]
name = "queue_and_events"
required-features = ["integration-tests"]

[[test]]
name = "action_queue"
required-features = ["integration-tests"]

[[test]]
name = "approval_grants"
required-features = ["integration-tests"]

[[test]]
name = "auto_approval"
required-features = ["integration-tests"]

# Drives the real component against a real gateway and whatever model it
# routes to. `live-providers` rather than `integration-tests` for the reason
# that flag exists: the gateway a developer has running may be pointed at a
# paid provider, and running the suite is not consent to be billed for a model
# writing out the numbers one to twenty. The fake-gateway suite asserts the
# same three things -- deltas arrive, they are more than one, and they match
# the final reply -- in under a second and against nobody's key.
[[test]]
name = "agent_component"
required-features = ["live-providers"]

# Uses a scripted gateway rather than a live model, so it needs no services --
# but it is the most expensive suite here, so it waits to be asked for.
[[test]]
name = "agent_component_fake"
required-features = ["slow-tests"]

# The only suite that spends money. See `live-providers` above for why it is
# reachable by no other flag.
[[test]]
name = "provider_live"
required-features = ["live-providers"]

[[bin]]
name = "outturn-catalog"
path = "src/bin/outturn-catalog.rs"

[[bin]]
name = "outturn-seal"
path = "src/bin/outturn-seal.rs"

[lints]
workspace = true

# Two clippy lints turned off for the whole workspace rather than with attributes
# scattered over six sites, because in both cases the decision is one decision
# and it is easier to argue with in one place.
[workspace.lints.clippy]
# Fires on constructors and store traits that take a handle per dependency:
# `Router::new` takes seventeen, and `ChatStore::append_message` eight. The
# suggested remedy is to bundle them into a struct, which moves the arguments
# somewhere else and adds a type whose only purpose is to have fields. These
# are injection sites, written to be explicit about what a thing depends on --
# a long list there is the design working, not a smell. Kept as a lint for
# ordinary functions would mean silencing it six times and growing; a function
# that genuinely takes too many arguments is something review can catch.
too_many_arguments = "allow"

# Both sites are the Merkle tree's level-building loop in src/egress/commit.rs,
# where `chunks_exact(2)` pairs the leaves and `remainder()` is the odd one
# carried up a level -- the case the domain separation exists for. `as_chunks`
# is equivalent, but it returns a tuple whose `.0` and `.1` say nothing, and
# this is commitment code where a reader should be able to see the odd leaf
# being handled. Clarity wins over the idiom here.
chunks_exact_to_as_chunks = "allow"

# Dependencies optimized even in a debug build; this crate's own code is not.
# Wasmtime compiling a component, Postgres decoding and the hashing behind
# every commitment run noticeably faster at opt-level 1, which is felt in every
# test run, and the cost is paid once: dependencies are rebuilt when they
# change, not when this crate does. Incremental builds of our own code are
# unaffected.
[profile.dev.package."*"]
opt-level = 1

# Symbols stripped and thin LTO: smaller binaries in smaller images, for a
# slower release build. The cost is in backtraces: a panic still says what
# and where -- message, file and line are compiled in -- but its frames are
# addresses rather than names. A debug build is where one gets read.
[profile.release]
strip = true
lto = "thin"

# What local images are built with (skaffold.yaml's local profiles). A release build turns
# incremental compilation off and runs LTO once per binary, so a one-line
# change rebuilt the whole crate and linked it five times. Lightly
# optimized, so a turn behaves near enough to production; never shipped.
[profile.local]
inherits = "release"
opt-level = 1
lto = false
incremental = true
