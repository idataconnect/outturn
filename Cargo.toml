[package]
name = "outturn"
version = "0.0.1"
edition = "2024"
resolver = "3"
description = "A multitenant agent platform"
license = "Apache-2.0"

[lib]
# The component bindings are generated by wasmtime's bindgen! macro, and
# rustdoc cannot resolve the module it produces -- so every `cargo test` run
# ends in a doctest failure that has nothing to do with the tests. There are no
# doc examples to run, so the whole phase is switched off rather than left
# failing where it would mask a real one.
doctest = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "migrate", "chrono"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-stream = "0.3"
tracing-opentelemetry = "0.33.0"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"
anyhow = "1"
pasetors = { version = "0.7", features = ["paserk"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "2"
argon2 = "0.6"
sha2 = "0.10"
# Webhook signatures, both ends: the API verifies an inbound delivery and the
# Hollowbrook fixture signs an outbound one.
hmac = "0.12"
hex = "0.4"
# Data URLs for an image on its way to a model; nothing else here needs it,
# and the session token that claims to be base64 is hex.
base64 = "0.22"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# fail-on-err is in the crate's default set and default-features = false had
# quietly dropped it, so every non-2xx answer came back as Ok: a rejected PUT
# reported success, a 403 body was returned as a file's contents, and the
# classifier below it never saw an error at all.
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
chrono-tz = { version = "0.10.4", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# test-util provides the virtual clock, so tests that only wait need not
# spend real time doing it.
tokio = { version = "1.53.1", features = ["full", "test-util"] }

[features]
# Tests that need services running: Postgres for the database suites, a
# gateway and model for the agent component. Gated so `cargo test` on a bare
# checkout builds and runs only what needs nothing, rather than silently
# skipping and reporting success. Each database test runs in its own schema,
# so they are safe to run in parallel.
#
# Implies slow-tests, so one flag before a push runs everything.
integration-tests = ["slow-tests"]

# Tests gated for what they cost rather than for what they need. The component
# suite needs no services at all, but instantiates a WebAssembly sandbox per
# case and saturates the machine doing it -- which is a poor trade for the
# check someone runs twenty times an hour while changing one function.
slow-tests = []

# Tests that call a real provider, on a real key, and spend real money.
#
# Deliberately implied by nothing. `integration-tests` means "I have services
# running"; this means "I am willing to be billed", and they are not the same
# sentence. Somebody who clones this, sets the keys the documentation tells
# them to set, and runs the suite a dozen times while finding their way around
# should not discover afterwards that we spent their money for them. A key in
# the environment is a key, not permission.
#
# So the flag is the consent, and it has to be typed every time:
#
#     cargo test --features live-providers
#
# Within the suite a missing key fails rather than skips. Asking for these
# tests and being told they passed without any of them having run is the one
# outcome worse than not running them.
live-providers = []

# The mock provider. A binary rather than a test fixture because a load test
# has to go through the gateway's real HTTP client, streaming and timeouts --
# an in-process stand-in measures the stand-in.
[[bin]]
name = "mockllm"
path = "src/bin/mockllm.rs"

[[bin]]
name = "hollowbrook"
path = "src/bin/hollowbrook.rs"

[[test]]
name = "api"
required-features = ["integration-tests"]

[[test]]
name = "queue_and_events"
required-features = ["integration-tests"]

# Drives the real component against a real gateway and whatever model it
# routes to. `live-providers` rather than `integration-tests` for the reason
# that flag exists: the gateway a developer has running may be pointed at a
# paid provider, and running the suite is not consent to be billed for a model
# writing out the numbers one to twenty. The fake-gateway suite asserts the
# same three things -- deltas arrive, they are more than one, and they match
# the final reply -- in under a second and against nobody's key.
[[test]]
name = "agent_component"
required-features = ["live-providers"]

# Uses a scripted gateway rather than a live model, so it needs no services --
# but it is the most expensive suite here, so it waits to be asked for.
[[test]]
name = "agent_component_fake"
required-features = ["slow-tests"]

# The only suite that spends money. See `live-providers` above for why it is
# reachable by no other flag.
[[test]]
name = "provider_live"
required-features = ["live-providers"]

# Two clippy lints turned off for the whole crate rather than with attributes
# scattered over six sites, because in both cases the decision is one decision
# and it is easier to argue with in one place.
[lints.clippy]
# Fires on constructors and store traits that take a handle per dependency:
# `Router::new` takes seventeen, and `ChatStore::append_message` eight. The
# suggested remedy is to bundle them into a struct, which moves the arguments
# somewhere else and adds a type whose only purpose is to have fields. These
# are injection sites, written to be explicit about what a thing depends on --
# a long list there is the design working, not a smell. Kept as a lint for
# ordinary functions would mean silencing it six times and growing; a function
# that genuinely takes too many arguments is something review can catch.
too_many_arguments = "allow"

# Both sites are the Merkle tree's level-building loop in src/egress/commit.rs,
# where `chunks_exact(2)` pairs the leaves and `remainder()` is the odd one
# carried up a level -- the case the domain separation exists for. `as_chunks`
# is equivalent, but it returns a tuple whose `.0` and `.1` say nothing, and
# this is commitment code where a reader should be able to see the odd leaf
# being handled. Clarity wins over the idiom here.
chunks_exact_to_as_chunks = "allow"
