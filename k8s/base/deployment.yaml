apiVersion: apps/v1
kind: Deployment
metadata:
  name: outturn-api
spec:
  # No replicas here on purpose: k8s/autoscaling gives this an HPA, and a
  # count in the manifest would be reset to it on every apply -- silently
  # undoing whatever the autoscaler had decided.
  selector:
    matchLabels:
      app: outturn-api
  template:
    metadata:
      labels:
        app: outturn-api
    spec:
      # The queue worker and the long-poll hold connections open: a runtime
      # asking for work waits up to 25s (WORK_POLL_TIMEOUT), and graceful
      # shutdown waits for every such request to answer. Well past that, so a
      # rollout never cuts a poll or a stream mid-answer.
      terminationGracePeriodSeconds: 60
      # Nothing here talks to the Kubernetes API, so nothing should be handed
      # a token that could.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: outturn-api
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outturn-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outturn-gateway
  template:
    metadata:
      labels:
        app: outturn-gateway
    spec:
      # A model's stream may sit silent for the idle read timeout (five
      # minutes) before the gateway gives up on it, and shutdown waits for
      # streams in flight. Matches the runtime, which must not be left
      # waiting on a gateway that has gone before it.
      terminationGracePeriodSeconds: 360
      # Nothing here talks to the Kubernetes API, so nothing should be handed
      # a token that could.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: outturn-gateway
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outturn-runtime
spec:
  # No replicas here on purpose: k8s/autoscaling gives this an HPA, and a
  # count in the manifest would be reset to it on every apply -- silently
  # undoing whatever the autoscaler had decided.
  selector:
    matchLabels:
      app: outturn-runtime
  template:
    metadata:
      labels:
        app: outturn-runtime
    spec:
      # Nothing here talks to the Kubernetes API, so nothing should be handed
      # a token that could.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # Long enough for a turn already streaming to finish and be reported.
      # On SIGTERM the runtime stops asking for work and waits for the turns
      # it holds; if this runs out first the lease recovers them, at the cost
      # of the user watching a reply restart. Well past the five minutes a
      # stream may sit silent before the runtime gives up on it.
      terminationGracePeriodSeconds: 360
      containers:
        - name: runtime
          image: outturn-runtime
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            # The root is read-only; this is where anything that wants a
            # scratch file in the process (a temp file, a library's cache)
            # lands, and it is gone with the pod.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
