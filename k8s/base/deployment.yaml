apiVersion: apps/v1
kind: Deployment
metadata:
  name: outturn-api
spec:
  # No replicas here on purpose: k8s/autoscaling gives this an HPA, and a
  # count in the manifest would be reset to it on every apply -- silently
  # undoing whatever the autoscaler had decided.
  selector:
    matchLabels:
      app: outturn-api
  template:
    metadata:
      labels:
        app: outturn-api
    spec:
      containers:
        - name: api
          image: outturn-api
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outturn-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outturn-gateway
  template:
    metadata:
      labels:
        app: outturn-gateway
    spec:
      containers:
        - name: gateway
          image: outturn-gateway
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outturn-runtime
spec:
  # No replicas here on purpose: k8s/autoscaling gives this an HPA, and a
  # count in the manifest would be reset to it on every apply -- silently
  # undoing whatever the autoscaler had decided.
  selector:
    matchLabels:
      app: outturn-runtime
  template:
    metadata:
      labels:
        app: outturn-runtime
    spec:
      # Long enough for a turn already streaming to finish and be reported.
      # On SIGTERM the runtime stops asking for work and waits for the turns
      # it holds; if this runs out first the lease recovers them, at the cost
      # of the user watching a reply restart. Well past the five minutes a
      # stream may sit silent before the runtime gives up on it.
      terminationGracePeriodSeconds: 360
      containers:
        - name: runtime
          image: outturn-runtime
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
