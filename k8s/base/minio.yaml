# Development configuration. The password below is a known value, published in
# this repository, and these manifests are not meant for a real cluster --
# every overlay here is a local one, and scripts/deploy-prod.sh generates
# production manifests separately and refuses to emit any published key.
# See SECURITY.md.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # The image runs as its own unprivileged user, so the volume is given
      # to that user's group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        # A volume written by the image that used to be here belongs to root,
        # and the local storage class ignores fsGroup, so MinIO could not
        # write to it ("Unable to write to the backend"). Handed over once;
        # after that the check finds it already theirs and does nothing.
        - name: own-data
          image: alpine:3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - '[ "$(stat -c %u /data)" = 65532 ] || chown -R 65532:65532 /data'
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minio
          # MinIO stopped publishing community images, so the one that used
          # to be here was frozen: no fixes, ever. This one is maintained and
          # tracks the latest release, so it is pinned by digest -- the same
          # bytes on every machine until somebody moves the pin on purpose.
          # Production runs it too (docs/deployment.md). Moving the pin:
          # `docker buildx imagetools inspect cgr.dev/chainguard/minio:latest`.
          image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: outturn
            - name: MINIO_ROOT_PASSWORD
              value: outturn-dev
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
