# Development configuration. The password below is a known value, published in
# this repository, and these manifests are not meant for a real cluster --
# every overlay here is a local one, and scripts/deploy-prod.sh generates
# production manifests separately and refuses to emit any published key.
# See SECURITY.md.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # quay.io rather than Docker Hub: MinIO stopped publishing the
          # community image there, and `docker pull minio/minio` now answers
          # "pull access denied ... or may require 'docker login'", which reads
          # like a private repository rather than like an image that has gone.
          # A machine that already had a copy kept working, so this surfaced
          # only on a fresh checkout -- the worst place for it, since it is
          # somebody's first attempt to bring the stack up.
          image: quay.io/minio/minio:latest
          # A `:latest` tag defaults to pulling on every start, and an
          # anonymous pull of a popular image can be rate limited -- so a
          # cluster that has the image already would sit in ImagePullBackOff
          # waiting for permission to fetch what is on its own disk. Kept for
          # whatever is local; a newer one arrives by pulling it deliberately.
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: outturn
            - name: MINIO_ROOT_PASSWORD
              value: outturn-dev
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
