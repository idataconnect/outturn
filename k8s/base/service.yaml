apiVersion: v1
kind: Service
metadata:
  name: outturn-api
spec:
  selector:
    app: outturn-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: outturn-gateway
spec:
  selector:
    app: outturn-gateway
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: outturn-runtime
spec:
  selector:
    app: outturn-runtime
  ports:
    - port: 8082
      targetPort: 8082
