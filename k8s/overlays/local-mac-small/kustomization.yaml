apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A Mac with less memory to spare. Selected by `skaffold dev -p mac-small`, or
# by `scripts/dev-mac.sh --small`.
#
# Everything ../local-mac says about reaching ollama on the host still holds;
# the only difference is which model answers. qwen3.5 is far smaller loaded
# than qwen3.8's 22GB, which is what makes a 32GB machine comfortable -- and on
# a 64GB one it leaves room for the cluster's VM, a browser and a build at the
# same time, which qwen3.8 does not always.

resources:
  - ../local-mac

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: outturn-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: OUTTURN_DEFAULT_MODEL
                    value: "qwen3.5"
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: outturn-runtime
      spec:
        template:
          spec:
            containers:
              - name: runtime
                env:
                  - name: OUTTURN_DEFAULT_MODEL
                    value: "qwen3.5"
