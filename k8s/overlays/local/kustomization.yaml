apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# This clone's own keys, generated by scripts/dev-secrets.sh and gitignored.
# Read from a file rather than written here so that nothing high-entropy is
# committed: the same values in the repository would be shared by every clone
# and reported by every scanner that looks at it.
#
# A missing file stops the build with a message naming it, which is the right
# way round -- the alternative is three tiers starting with keys that do not
# match and a login that fails for no visible reason.
secretGenerator:
  - name: outturn-dev-secrets
    envs:
      - dev-secrets.env

# The name is referenced by the patches below, so it has to stay put. The hash
# suffix exists to roll pods when a secret changes; here that is what
# `skaffold dev` already does on every deploy.
generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: outturn-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          # The API is the only tier that signs anything. Generated per clone
          # by scripts/dev-secrets.sh, never committed: a key in the repository
          # is one every clone shares. A real deployment uses its own Secret --
          # see scripts/deploy-prod.sh.
          - name: OUTTURN_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_TOKEN_SECRET
          - name: OUTTURN_TOKEN_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_TOKEN_PUBLIC_KEY
          # What the runtime presents to take work. Shared with the runtime
          # and nobody else; it means "the runtime tier" and nothing more.
          - name: OUTTURN_RUNTIME_KEY
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_RUNTIME_KEY
          - name: DATABASE_URL
            value: "postgres://outturn:outturn-dev@postgres:5432/outturn"
          # The same bucket the runtime uses, for uploads from the browser.
          - name: OUTTURN_S3_ENDPOINT
            value: "http://minio:9000"
          - name: OUTTURN_S3_BUCKET
            value: "outturn"
          - name: OUTTURN_S3_ACCESS_KEY
            value: "outturn"
          - name: OUTTURN_S3_SECRET_KEY
            value: "outturn-dev"
          - name: OUTTURN_DEV_SEED
            value: "1"
          # Who that seed creates. Generated with the keys, so the password is
          # this clone's rather than one published in the repository; read it
          # back with scripts/dev-secrets.sh --print.
          - name: OUTTURN_DEV_ADMIN_EMAIL
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_DEV_ADMIN_EMAIL
          - name: OUTTURN_DEV_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_DEV_ADMIN_PASSWORD
          # Where the namer sends its one request per new conversation. The
          # API otherwise never talks to the gateway; turns do, from the
          # runtime.
          - name: OUTTURN_GATEWAY_URL
            value: "http://outturn-gateway:8081"
          # qwen3.5 rather than llama3.1: the agent offers tools on every
          # turn, and llama3.1's template stops streaming when tools are
          # present -- a reply collapses from ~26 chunks to 3. Both qwen3.5
          # and gemma4 stream either way. Per-model behavior, not an ollama or
          # gateway one.
          #
          # Over gemma4 because gemma4 writes its whole reply before it acts:
          # asked to check the time and then report it, it produced the prose
          # first -- quoting a time from earlier in the session -- and only
          # then called the clock. Handed the correct result on the next round
          # it answered with a single token rather than correcting itself.
          - name: OUTTURN_DEFAULT_MODEL
            value: "qwen3.5"
  - target:
      kind: Deployment
      name: outturn-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          # ollama speaks the OpenAI chat-completions protocol, so it is
          # reached through the same provider as api.openai.com -- only the
          # base URL differs, and no key is wanted.
          - name: OPENAI_BASE_URL
            value: "http://172.18.0.1:11434"
          # The circuit breaker is shared across replicas, so it lives in the
          # database. Absent, the gateway simply calls every provider.
          - name: DATABASE_URL
            value: "postgres://outturn:outturn-dev@postgres:5432/outturn"
          - name: OUTTURN_TOKEN_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_TOKEN_PUBLIC_KEY
          # Real provider keys, for trying a route against the thing itself.
          # Optional: the secret need not exist, and without it the gateway
          # skips any route naming a credential it cannot resolve, which
          # leaves local development working exactly as it did.
          #
          # Created by hand rather than committed, because it is a real key:
          #   kubectl create secret generic outturn-provider-keys \
          #     --from-literal=GEMINI_API_KEY="$(cat .gemini-api-key)"
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: outturn-provider-keys
                key: GEMINI_API_KEY
                optional: true
  - target:
      kind: Deployment
      name: outturn-runtime
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          # No signing key here, on purpose: this tier runs workspace code, and
          # must hold nothing that could mint a credential for anyone. The
          # API mints each turn's gateway token and hands it over with the
          # turn; this key only says "I am the runtime tier".
          - name: OUTTURN_RUNTIME_KEY
            valueFrom:
              secretKeyRef:
                name: outturn-dev-secrets
                key: OUTTURN_RUNTIME_KEY
          # Agents execute here, so this is the tier that reaches the gateway.
          - name: OUTTURN_GATEWAY_URL
            value: "http://outturn-gateway:8081"
          # Where this pod asks for work. Nothing pushes turns to it, so a
          # runtime that cannot reach the API sits idle rather than failing.
          - name: OUTTURN_API_URL
            value: "http://outturn-api:8080"
          # Object storage for agent files. One bucket, partitioned by workspace
          # prefix; the runtime resolves which part a turn may touch. Without
          # these the runtime falls back to memory, which loses everything on
          # restart -- fine for a smoke test, misleading for anything else.
          - name: OUTTURN_S3_ENDPOINT
            value: "http://minio:9000"
          - name: OUTTURN_S3_BUCKET
            value: "outturn"
          - name: OUTTURN_S3_ACCESS_KEY
            value: "outturn"
          - name: OUTTURN_S3_SECRET_KEY
            value: "outturn-dev"
          # qwen3.5 rather than llama3.1: the agent offers tools on every
          # turn, and llama3.1's template stops streaming when tools are
          # present -- a reply collapses from ~26 chunks to 3. Both qwen3.5
          # and gemma4 stream either way. Per-model behavior, not an ollama or
          # gateway one.
          #
          # Over gemma4 because gemma4 writes its whole reply before it acts:
          # asked to check the time and then report it, it produced the prose
          # first -- quoting a time from earlier in the session -- and only
          # then called the clock. Handed the correct result on the next round
          # it answered with a single token rather than correcting itself.
          - name: OUTTURN_DEFAULT_MODEL
            value: "qwen3.5"
          # The pod's memory limit is 512Mi, the same as base, so what is
          # learned here about admission carries over. Each turn is charged
          # 100Mi (ASSUMED_TURN_BYTES) and the guest itself is capped at
          # 128Mi (GUEST_MEMORY_LIMIT), so two turns beside a 128Mi reserve
          # fit and a third does not. A single developer sending one message
          # at a time never reaches these; a load test should.
          - name: OUTTURN_MAX_CONCURRENT_TURNS
            value: "2"
          - name: OUTTURN_MEMORY_RESERVE_BYTES
            value: "134217728"
