apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: outturn-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: OUTTURN_TOKEN_SECRET
            value: "993c3d8e41668abaa0151de741215ef5bf5022b62bdb8468122df597c70d5887"
          - name: OUTTURN_TOKEN_PUBLIC_KEY
            value: "433388b76ceaa6de2db078d26935cbcff46207149af743d530a04a023ad13c54"
          - name: DATABASE_URL
            value: "postgres://outturn:outturn-dev@postgres:5432/outturn"
          - name: OUTTURN_DEV_SEED
            value: "1"
          # gemma4 rather than llama3.1: the agent offers tools on every
          # turn, and llama3.1's template stops streaming when tools are
          # present -- a reply collapses from ~26 chunks to 3. gemma4 streams
          # either way. Per-model behaviour, not an ollama or gateway one.
          - name: OUTTURN_DEFAULT_MODEL
            value: "gemma4"
  - target:
      kind: Deployment
      name: outturn-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          # ollama speaks the OpenAI chat-completions protocol, so it is
          # reached through the same provider as api.openai.com -- only the
          # base URL differs, and no key is wanted.
          - name: OPENAI_BASE_URL
            value: "http://172.18.0.1:11434"
          # The circuit breaker is shared across replicas, so it lives in the
          # database. Absent, the gateway simply calls every provider.
          - name: DATABASE_URL
            value: "postgres://outturn:outturn-dev@postgres:5432/outturn"
          - name: OUTTURN_TOKEN_PUBLIC_KEY
            value: "433388b76ceaa6de2db078d26935cbcff46207149af743d530a04a023ad13c54"
  - target:
      kind: Deployment
      name: outturn-runtime
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: OUTTURN_TOKEN_SECRET
            value: "993c3d8e41668abaa0151de741215ef5bf5022b62bdb8468122df597c70d5887"
          - name: OUTTURN_TOKEN_PUBLIC_KEY
            value: "433388b76ceaa6de2db078d26935cbcff46207149af743d530a04a023ad13c54"
          # Agents execute here, so this is the tier that reaches the gateway.
          - name: OUTTURN_GATEWAY_URL
            value: "http://outturn-gateway:8081"
          # Where this pod asks for work. Nothing pushes turns to it, so a
          # runtime that cannot reach the API sits idle rather than failing.
          - name: OUTTURN_API_URL
            value: "http://outturn-api:8080"
          # Object storage for agent files. One bucket, partitioned by tenant
          # prefix; the runtime resolves which part a turn may touch. Without
          # these the runtime falls back to memory, which loses everything on
          # restart -- fine for a smoke test, misleading for anything else.
          - name: OUTTURN_S3_ENDPOINT
            value: "http://minio:9000"
          - name: OUTTURN_S3_BUCKET
            value: "outturn"
          - name: OUTTURN_S3_ACCESS_KEY
            value: "outturn"
          - name: OUTTURN_S3_SECRET_KEY
            value: "outturn-dev"
          # gemma4 rather than llama3.1: the agent offers tools on every
          # turn, and llama3.1's template stops streaming when tools are
          # present -- a reply collapses from ~26 chunks to 3. gemma4 streams
          # either way. Per-model behaviour, not an ollama or gateway one.
          - name: OUTTURN_DEFAULT_MODEL
            value: "gemma4"
          # The pod's memory limit here is 1Gi, so the defaults (8 turns,
          # 256Mi held clear) would admit far past what one local pod can
          # hold. A single developer sending one message at a time never
          # reaches these; a load test should.
          - name: OUTTURN_MAX_CONCURRENT_TURNS
            value: "2"
          - name: OUTTURN_MEMORY_RESERVE_BYTES
            value: "134217728"
