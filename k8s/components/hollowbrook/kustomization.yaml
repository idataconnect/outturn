apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Hollowbrook House, running beside outturn rather than sitting at zero
# replicas.
#
# The base deploys it stopped, because a fixture that runs in everybody's
# cluster is a fixture nobody asked for. This is the whole of turning it on,
# and it exists so a demonstration is one flag rather than a page of kubectl.
#
# What it demonstrates is the thing the platform is for: a workspace whose
# agents work against its own systems. Hollowbrook has a REST API and serves
# its own /openapi.json, so a skill can describe it and an agent can book a
# room -- which is a more honest exercise of the egress path than any fixture
# that only answers.
#
# Two different acts open the path, and both happen. `OUTTURN_INTERNAL_HOSTS`
# says the platform may reach a private address at all -- an operator decision,
# carried by the overlay because it is one variable and JSON Patch cannot
# append to a string, built by scripts/dev-mac.sh from each component's
# `internal-host` file. The workspace's own egress rule says its agents may
# ask, and the install Job approves that as part of installing the skill that
# declared the host.
patches:
  - target:
      kind: Deployment
      name: outturn-hollowbrook
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

resources:
  - install-job.yaml

# The script and the skill as files rather than a wall of YAML, so they can be
# read, diffed and adapted. A customer copying this component for their own API
# replaces what is in skill/ and edits little else.
configMapGenerator:
  - name: install-hollowbrook
    files:
      - install.sh
  - name: hollowbrook-skill
    files:
      - skill/index.md
      - skill/list_rooms.md
      - skill/check_availability.md
      - skill/list_bookings.md
      - skill/get_booking.md
      - skill/create_booking.md

# Named for their content, so editing a file makes a new ConfigMap and the Job
# picks it up. Without this a changed skill would be a ConfigMap nothing
# noticed had changed.
generatorOptions:
  disableNameSuffixHash: false
