apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - petstore.yaml

# Nothing in outturn is pointed at a sample API: an agent reaches one the way
# it reaches any other host, through the gateway and against an egress rule a
# workspace allowed.
#
# What travels with it is the operator's half of that. The gateway refuses a
# host resolving to a private address, which is what stops a workspace aiming
# it at `outturn-api` -- and `OUTTURN_INTERNAL_HOSTS` is the exception only
# somebody outside the workspace can add, checked before the refusal. See
# "An operator allowlist, by name" in docs/egress.md.
#
# A workspace still has to allow `petstore` in its own rules. This says the
# gateway *may* go there, not that anyone may ask it to.
#
# The host is not opened here. `OUTTURN_INTERNAL_HOSTS` is one variable, and
# JSON Patch cannot append to a string -- so a second component opening a host
# would overwrite the first rather than join it, and whichever lost would be
# unreachable with nothing said about why. The overlay carries the whole list
# instead: scripts/lib/dev.sh writes it from the components asked for.
#
# What a component may safely bring is its own service and its own
# configuration, which is what this and the tika component do.
