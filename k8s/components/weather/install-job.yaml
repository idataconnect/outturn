# Installs the skill that describes Weather's API, once, after the API is
# up.
#
# A Job rather than anything in the platform. What it does is what a customer
# does for their own service -- sign in, create a skill, approve its host,
# upload its files -- using the endpoints outturn already publishes. Putting it
# in the platform would mean a customer needed a fork to do the same thing, and
# a fork loses to every upgrade.
#
# The script and the skill both come from a ConfigMap, so changing either is
# changing a file in this component rather than rebuilding an image.
apiVersion: batch/v1
kind: Job
metadata:
  name: install-weather
spec:
  # Cleaned up shortly after it finishes.
  #
  # A Job's template is immutable, so a completed one cannot be updated -- and
  # a changed skill means a new ConfigMap hash, which means a new template, and
  # `kubectl apply` refuses with a page of diff. Letting it delete itself means
  # the next apply creates rather than patches.
  #
  # Long enough to read the logs afterwards, short enough that a redeploy in
  # the same sitting is not blocked by it.
  ttlSecondsAfterFinished: 600
  # Retried a few times, because it waits on the API and a cluster coming up
  # cold can take longer than the wait allows.
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: install-weather
    spec:
      restartPolicy: OnFailure
      containers:
        - name: install
          # Alpine plus the two tools, rather than an image that ships them.
          # The official image is one a cluster is likely to have already, and
          # what the Job needs is then visible here instead of inside
          # somebody's Dockerfile -- which matters for a component meant to be
          # copied and adapted.
          #
          # The cost is a package fetch each run. Acceptable for a Job that
          # runs once at bring-up, and the alternative was the jq image, which
          # is 842KB of jq and no shell at all: this failed with
          # `stat /bin/sh: no such file or directory` before it ran a line.
          image: alpine:3
          command:
            - /bin/sh
            - -c
            - apk add --no-cache curl jq >/dev/null && exec /bin/sh /install/install.sh
          env:
            - name: OUTTURN_API
              value: "http://outturn-api:8080"
            - name: OUTTURN_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: outturn-dev-secrets
                  key: OUTTURN_DEV_ADMIN_EMAIL
            - name: OUTTURN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outturn-dev-secrets
                  key: OUTTURN_DEV_ADMIN_PASSWORD
          volumeMounts:
            - name: install
              mountPath: /install
            - name: skill
              mountPath: /skill
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: install
          configMap:
            name: install-weather
        - name: skill
          configMap:
            name: weather-skill
