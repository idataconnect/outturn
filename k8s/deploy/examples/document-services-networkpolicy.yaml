# The paths OUTTURN_TIKA_URL, OUTTURN_PDF_RENDERER_URL and OUTTURN_HEIC_URL
# need, which k8s/deploy's policies do not open: none is part of a release, and
# without these the namespace's default deny refuses the connection and the
# feature looks broken rather than unconfigured. Add this file to an overlay's
# resources beside the services themselves, keeping only the parts for the
# ones that are deployed.
#
# Written for each running in outturn's namespace with the labels
# k8s/components/tika, k8s/components/pdf-renderer and k8s/components/heic
# give them. For one
# elsewhere, replace each podSelector naming it with a namespaceSelector, and
# drop the ingress policy, which is then that namespace's to write.
#
# Tika is called by the API alone. The runtime reads OUTTURN_TIKA_URL only to
# know that documents are being extracted, and never connects to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outturn-api-to-tika
spec:
  podSelector:
    matchLabels:
      app: outturn-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tika
      ports:
        - protocol: TCP
          port: 9998
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tika-from-api
spec:
  podSelector:
    matchLabels:
      app: tika
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: outturn-api
      ports:
        - protocol: TCP
          port: 9998
---
# The PDF renderer is called by the runtime alone, and reaches nothing: what
# it renders is markdown the runtime sends, so it has no reason to fetch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outturn-runtime-to-pdf-renderer
spec:
  podSelector:
    matchLabels:
      app: outturn-runtime
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: outturn-pdf-renderer
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outturn-pdf-renderer-from-runtime
spec:
  podSelector:
    matchLabels:
      app: outturn-pdf-renderer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: outturn-runtime
      ports:
        - protocol: TCP
          port: 8090
  egress: []
---
# The HEIC converter is called by the API alone, at upload, and reaches
# nothing: it is handed a photo and answers with a JPEG.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outturn-api-to-heic
spec:
  podSelector:
    matchLabels:
      app: outturn-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: outturn-heic
      ports:
        - protocol: TCP
          port: 8091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outturn-heic-from-api
spec:
  podSelector:
    matchLabels:
      app: outturn-heic
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: outturn-api
      ports:
        - protocol: TCP
          port: 8091
  egress: []
