# Scaling on queue depth, which is the only number that says whether the
# cluster is keeping up. CPU says how hard the pods that exist are working,
# which stays high whether there are two turns waiting or two thousand.
#
# Optional and applied separately: it needs KEDA's CRDs, and a local kind
# cluster that has never installed KEDA should still come up.
---
apiVersion: v1
kind: Secret
metadata:
  name: outturn-keda
type: Opaque
stringData:
  # The scaler reads the queue; it never writes to it. Point this at a role
  # with select on `jobs` and nothing else.
  connection: postgres://outturn:outturn-dev@postgres:5432/outturn?sslmode=disable
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: outturn-queue
spec:
  secretTargetRef:
    - parameter: connection
      name: outturn-keda
      key: connection
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outturn-runtime
spec:
  scaleTargetRef:
    name: outturn-runtime
  # Never to zero. A cold runtime pod has to compile the guest component
  # before it can answer, so scaling to zero moves that cost onto whichever
  # user happens to send the first message after a quiet period.
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  # Only governs scaling to zero, which minReplicaCount rules out, so this is
  # inert here. What protects a turn mid-generation when a pod is scaled in
  # is the runtime's own drain on SIGTERM and the deployment's
  # terminationGracePeriodSeconds, not anything in this object.
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # Bursts are the normal case here -- a scheduled fleet of agents all
          # waking at once -- and waiting to be sure is just latency.
          stabilizationWindowSeconds: 0
        scaleDown:
          # Slow, because the cost of being wrong is asymmetric: an extra pod
          # costs money, a missing one costs a queued user.
          stabilizationWindowSeconds: 600
  triggers:
    - type: postgresql
      metricType: AverageValue
      authenticationRef:
        name: outturn-queue
      metadata:
        # One, because the query returns pods rather than a quantity to be
        # divided into pods. With AverageValue the HPA divides the metric by
        # the current replica count and compares to this, which works out to
        # ceil(metric / target) replicas -- so the view's answer is taken as
        # the replica count. The arithmetic lives in `desired_runtime_pods` in
        # migrations/0001_initial.sql, where it can be read and changed without
        # anyone reverse-engineering a threshold.
        targetQueryValue: "1"
        # Turns that could start now, which is not the same as turns waiting.
        # `job_backlog` is defined in migrations/0001_initial.sql, beside the
        # table and the claim it has to agree with.
        query: >-
          select pods from desired_runtime_pods
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outturn-api
spec:
  scaleTargetRef:
    name: outturn-api
  # The API serves the browser as well as claiming turns, so it does not
  # follow the queue down to a single pod.
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 300
  triggers:
    - type: postgresql
      metricType: AverageValue
      authenticationRef:
        name: outturn-queue
      metadata:
        # Higher than the runtime's, because the API's share of a turn is
        # preparing it and recording what comes back, not running it. It scales
        # so that handing out work and writing transcripts does not become the
        # bottleneck.
        targetQueryValue: "40"
        # The same backlog the runtime scales on: rows that cannot be claimed
        # are not work. Summed across priorities -- the view groups by
        # priority, and a max would count only the busier class.
        query: >-
          select coalesce(sum(claimable), 0)
          from job_backlog where kind = 'chat.turn'
