[package]
name = "outturn-gateway"
description = "The outturn tier that talks to model providers and makes outbound requests for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# See the root manifest: rustdoc cannot resolve the component bindings, and
# there are no doc examples to run.
doctest = false

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
outturn-core = { path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
aws-lc-rs = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
