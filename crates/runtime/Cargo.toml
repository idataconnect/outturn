[package]
name = "outturn-runtime"
description = "The outturn tier that runs agent components in a WebAssembly sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# See the root manifest: rustdoc cannot resolve the component bindings, and
# there are no doc examples to run.
doctest = false

[[bin]]
name = "runtime"
path = "src/main.rs"

[dependencies]
outturn-core = { path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rust-s3 = { workspace = true }
chrono-tz = { workspace = true }

[lints]
workspace = true
