apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: outturn

build:
  local:
    useBuildkit: true
  artifacts:
    - image: outturn-api
      docker:
        dockerfile: Dockerfile
        target: api
    - image: outturn-gateway
      docker:
        dockerfile: Dockerfile
        target: gateway
    - image: outturn-runtime
      docker:
        dockerfile: Dockerfile
        target: runtime
    - image: outturn-mockllm
      docker:
        dockerfile: Dockerfile
        target: mockllm

manifests:
  kustomize:
    paths:
      - k8s/overlays/local

portForward:
  - resourceType: service
    resourceName: outturn-api
    port: 8080
    localPort: 18080
  - resourceType: service
    resourceName: outturn-gateway
    port: 8081
    localPort: 18081
  - resourceType: service
    resourceName: outturn-runtime
    port: 8082
    localPort: 18082
  - resourceType: service
    resourceName: postgres
    port: 5432
    localPort: 15432

profiles:
  # Document extraction. `skaffold dev -p tika` brings up Apache Tika beside
  # the rest and points the API at it; without it nothing is extracted and no
  # part of the core images changes.
  - name: tika
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-tika
  # A Mac. `skaffold dev -p mac` reaches ollama on the host rather than across
  # the Linux Docker bridge, and defaults to qwen3.8:27b-mlx. scripts/dev-mac.sh
  # checks ollama and the model first, then runs this.
  - name: mac
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-mac
  # A Mac with less memory to spare. As `mac`, but gemma4 rather than
  # qwen3.8:27b-mlx -- about 9.6GB loaded against 22GB. `scripts/dev-mac.sh
  # --small` runs this.
  - name: mac-small
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-mac-small
