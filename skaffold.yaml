apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: outturn

build:
  local:
    useBuildkit: true
  artifacts:
    - image: outturn-api
      docker:
        dockerfile: Dockerfile
        target: api
      # This clone's local keys, if it has none yet. On the first artifact
      # only: the hook is cheap but not free, and one generation per build is
      # enough. Silent once the file exists.
      #
      # Here rather than in a deploy hook because the overlay reads the file
      # through a secretGenerator, and kustomize renders before any deploy
      # hook runs -- a missing file has already failed the build by then.
      hooks:
        before:
          - command: ["scripts/dev-secrets.sh"]
    - image: outturn-gateway
      docker:
        dockerfile: Dockerfile
        target: gateway
    - image: outturn-runtime
      docker:
        dockerfile: Dockerfile
        target: runtime
    - image: outturn-mockllm
      docker:
        dockerfile: Dockerfile
        target: mockllm
    - image: outturn-hollowbrook
      docker:
        dockerfile: Dockerfile
        target: hollowbrook

manifests:
  kustomize:
    paths:
      - k8s/overlays/local

portForward:
  - resourceType: service
    resourceName: outturn-api
    port: 8080
    localPort: 18080
  - resourceType: service
    resourceName: outturn-gateway
    port: 8081
    localPort: 18081
  - resourceType: service
    resourceName: outturn-runtime
    port: 8082
    localPort: 18082
  - resourceType: service
    resourceName: postgres
    port: 5432
    localPort: 15432

profiles:
  # Document extraction. `skaffold dev -p tika` brings up Apache Tika beside
  # the rest and points the API at it; without it nothing is extracted and no
  # part of the core images changes.
  - name: tika
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-tika
  # A sample OpenAPI service. `skaffold dev -p petstore` brings up Swagger
  # Petstore beside the rest, for building against a real spec rather than one
  # written to suit the thing consuming it. Nothing points at it: an agent
  # reaches a host through the gateway, and the gateway refuses private
  # addresses, so this serves a spec to read rather than an endpoint to call.
  - name: petstore
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-petstore
  # What scripts/dev-mac.sh deploys. The overlay is written by that script
  # from the base and whichever components were asked for, because the
  # alternative is one committed overlay per combination and nobody keeps
  # four of those in step. Not useful on its own -- the path does not exist
  # until the script has run.
  - name: generated
    manifests:
      kustomize:
        paths:
          - k8s/overlays/.generated

  # A Mac. `skaffold dev -p mac` reaches ollama on the host rather than across
  # the Linux Docker bridge, and defaults to qwen3.8:27b-mlx. scripts/dev-mac.sh
  # checks ollama and the model first, then runs this.
  - name: mac
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-mac
  # A Mac with less memory to spare. As `mac`, but qwen3.5 rather than
  # qwen3.8:27b-mlx -- the smaller model of the same family, against 22GB.
  # `scripts/dev-mac.sh --small` runs this.
  - name: mac-small
    manifests:
      kustomize:
        paths:
          - k8s/overlays/local-mac-small
