apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: outturn

build:
  local:
    useBuildkit: true
  artifacts:
    - image: outturn-api
      docker:
        dockerfile: Dockerfile
        target: api
    - image: outturn-gateway
      docker:
        dockerfile: Dockerfile
        target: gateway
    - image: outturn-runtime
      docker:
        dockerfile: Dockerfile
        target: runtime
    - image: outturn-mockllm
      docker:
        dockerfile: Dockerfile
        target: mockllm

manifests:
  kustomize:
    paths:
      - k8s/overlays/local

portForward:
  - resourceType: service
    resourceName: outturn-api
    port: 8080
    localPort: 18080
  - resourceType: service
    resourceName: outturn-gateway
    port: 8081
    localPort: 18081
  - resourceType: service
    resourceName: outturn-runtime
    port: 8082
    localPort: 18082
  - resourceType: service
    resourceName: postgres
    port: 5432
    localPort: 15432
