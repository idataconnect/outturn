<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback for contexts that will not take an SVG icon. -->
    <link rel="apple-touch-icon" href="/outturn-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>outturn</title>
  </head>
  <body>
    <script>
      // Inline and blocking, so the class is on <html> before anything paints.
      // Deferring this to React would show a light background for one frame.
      (function () {
        try {
          var stored = localStorage.getItem('outturn.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // A private window can refuse storage; the stylesheet default stands.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
