[package]
name = "outturn-converter-heic"
version = "0.1.0"
edition = "2024"
description = "Converts HEIC photos to JPEG, as a service of its own"
license = "Apache-2.0"

# A workspace of its own: it links libheif, which nothing in the main
# workspace should need to build or test.
[workspace]

[[bin]]
name = "outturn-heic"
path = "src/main.rs"

[dependencies]
# libheif from the system, and through it the HEVC decoder plugin, which is
# what this whole crate exists to keep out of every other image. The 1.17 API,
# which is what Ubuntu 24.04 ships; Debian 13 ships newer.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
jpeg-encoder = { version = "0.7.1", default-features = false }
# The service. Versions as the main crate's, so the two move together.
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
