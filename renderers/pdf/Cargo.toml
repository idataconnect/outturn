[package]
name = "outturn-renderer-pdf"
version = "0.1.0"
edition = "2024"
description = "Renders markdown as a PDF, inside a sandbox of its own"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The PDF writer Typst uses, without the typesetting engine above it: font
# subsetting and embedding, which is the part a hand-rolled writer gets wrong.
# raster-images for the emoji font, whose glyphs are PNG bitmaps: without it
# krilla draws them as nothing.
krilla = { version = "0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# Advance widths for line breaking. The version krilla itself depends on.
skrifa = "0.42.0"
# Matched to the default agent's, which is matched to what cargo-component
# generates.
wit-bindgen-rt = "0.44"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
